<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Régie LED — Sortie</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  body.idle { cursor: none; }
  #hint { position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%); padding: 14px 22px; border-radius: 10px;
    background: rgba(20,20,24,.86); color: #f3efe6; font: 600 18px/1.3 "Helvetica Neue", Arial, sans-serif;
    border: 1px solid rgba(240,180,41,.6); transition: opacity .4s; pointer-events: none; text-align: center; }
  #hint.off { opacity: 0; }
  #hint small { display: block; font-weight: 400; opacity: .75; margin-top: 4px; font-size: 14px; }
</style>
</head>
<body>
<div id="hint">Clique ici pour passer en plein écran<small>Touche F — Échap pour sortir</small></div>
<script type="module" src="js/output.js"></script>
</body>
</html>
